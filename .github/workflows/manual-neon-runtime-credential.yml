name: Manual Neon restricted runtime credential (protected)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PROVISION-AICOMPANY-RUNTIME-ROLE exactly'
        required: true
        type: string
      neon_project:
        description: 'Confirm exact Neon project ID'
        required: true
        type: string
      neon_branch:
        description: 'Confirm exact Neon branch ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aicompany-production-database-bootstrap
  cancel-in-progress: false

jobs:
  provision-runtime-login:
    # Deliberately unavailable from feature/PR branches.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'PROVISION-AICOMPANY-RUNTIME-ROLE' &&
      inputs.neon_project == 'jolly-paper-27220159' &&
      inputs.neon_branch == 'br-quiet-feather-b7ew3f2r' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-database
    env:
      EXPECTED_NEON_PROJECT_ID: jolly-paper-27220159
      EXPECTED_NEON_BRANCH_ID: br-quiet-feather-b7ew3f2r
      AICOMPANY_ROLE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without database credentials
        run: npm ci
      - name: Test offline security and runtime credential gates
        run: node scripts/neon-bootstrap-guard.checks.cjs
      - name: Provision restricted SQL-created login and test connection
        env:
          AICOMPANY_MIGRATION_DATABASE_URL: ${{ secrets.AICOMPANY_MIGRATION_DATABASE_URL }}
          AICOMPANY_RUNTIME_ROLE_PASSWORD: ${{ secrets.AICOMPANY_RUNTIME_ROLE_PASSWORD }}
        run: node scripts/provision-neon-runtime-credential.cjs
