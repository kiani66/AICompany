name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aicompany
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: aicompany_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://aicompany:test-only-password@localhost:5432/aicompany_test
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      TEST_CEO_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production bootstrap security policy (offline; no remote writes)
        run: node scripts/neon-bootstrap-guard.checks.cjs
      - run: echo "CEO_PASSWORD_HASH=$(node -e "console.log(require('bcryptjs').hashSync(process.env.TEST_CEO_PASSWORD, 12))")" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
